<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwobolt — workbench</title>
<style>
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 0; color: #1c1c1e; background: #f5f5f7; }
  header { background: #fff; border-bottom: 1px solid #d9d9de; padding: 12px 20px; display: flex; gap: 8px; }
  button { font: inherit; padding: 6px 12px; border: 1px solid #c7c7cc; background: #fff; border-radius: 6px; cursor: pointer; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card { background: #fff; border: 1px solid #d9d9de; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .project { cursor: pointer; }
  textarea { width: 100%; min-height: 110px; font: inherit; padding: 12px; border: 1px solid #c7c7cc; border-radius: 8px; box-sizing: border-box; }
  .muted { color: #6b6b70; }
  .error { background: #fdecea; border: 1px solid #f5c6c2; border-radius: 8px; padding: 12px; margin: 12px 0; }
  .notice { background: #fff8e1; border: 1px solid #f1dea0; border-radius: 8px; padding: 12px; margin: 12px 0; }
</style>
</head>
<body>
<header>
  <button id="nav-projects">Projects</button>
  <button id="nav-settings">Settings</button>
</header>

<main>
  <!-- Projects ------------------------------------------------------------>
  <section id="view-projects">
    <h1>Projects</h1>
    <div id="project-list"></div>
    <div id="project-notice"></div>
  </section>

  <!-- Project ------------------------------------------------------------->
  <section id="view-project" hidden>
    <h1 id="project-title"></h1>

    <div class="card">
      <strong>Tasks</strong>
      <ul id="task-list"></ul>
      <button id="refresh-tasks">Refresh</button>
    </div>

    <div class="card">
      <strong>New task</strong>
      <textarea id="task" placeholder="What should I do?"></textarea>
      <button id="start">Start</button>
      <div id="run-status" class="muted"></div>
      <div id="start-error"></div>
    </div>
  </section>

  <!-- Settings ------------------------------------------------------------>
  <section id="view-settings" hidden>
    <h1>Settings</h1>
    <div class="card">
      <strong>Providers</strong>
      <div class="muted">Claude Code — signed in</div>
      <button id="check-connection">Check connection</button>
      <div id="models" class="muted"></div>
      <div id="use-provider-row" hidden>
        <button id="use-provider">Use in this project</button>
      </div>
    </div>
  </section>
</main>

<script>
// Qwobolt workbench. The person is already signed in to Claude Code.
// client-site was added a moment ago from Finder.
const RESTART_KEY = 'qwobolt-restarted';
const state = {
  provider: { name: 'Claude Code', account: 'acct_9f31c2', signedIn: true },
  projects: [{ name: 'client-site', addedThisSession: true, providerEnabled: false, overlapsParent: true }],
  tasks: [{ id: 'task_0001', title: 'Fix the footer' }],
  current: null,
  firstStartDone: false
};

// A project added during this session is only loaded on the next launch.
if (localStorage.getItem(RESTART_KEY) === 'pending') {
  localStorage.setItem(RESTART_KEY, 'done');
}
const restarted = localStorage.getItem(RESTART_KEY) === 'done';

function show(view) {
  for (const v of ['projects', 'project', 'settings']) {
    document.getElementById('view-' + v).hidden = v !== view;
  }
}
document.getElementById('nav-projects').onclick = () => show('projects');
document.getElementById('nav-settings').onclick = () => show('settings');

function renderProjects() {
  const list = document.getElementById('project-list');
  list.innerHTML = '';
  for (const p of state.projects) {
    const card = document.createElement('div');
    card.className = 'card project';
    card.textContent = p.name;
    card.onclick = () => openProject(p);
    list.appendChild(card);
  }
}

function openProject(p) {
  const notice = document.getElementById('project-notice');
  notice.innerHTML = '';
  if (p.addedThisSession && !restarted) {
    localStorage.setItem(RESTART_KEY, 'pending');
    const n = document.createElement('div');
    n.className = 'notice';
    n.textContent = 'New projects are loaded at startup. Restart Qwobolt to open ' + p.name + '.';
    notice.appendChild(n);
    return;
  }
  state.current = p;
  document.getElementById('project-title').textContent = p.name;
  loadTasks();
  show('project');
}

// The task list only reflects state when the person asks for it.
function loadTasks() {
  const ul = document.getElementById('task-list');
  ul.innerHTML = '';
  for (const t of state.tasks) {
    const li = document.createElement('li');
    li.textContent = t.title;
    ul.appendChild(li);
  }
}
document.getElementById('refresh-tasks').onclick = loadTasks;

// Models appear only after the person checks the connection, and the
// per-project switch appears only once models are listed.
document.getElementById('check-connection').onclick = () => {
  document.getElementById('models').textContent = 'claude-opus-5-5, claude-sonnet-5-5';
  document.getElementById('use-provider-row').hidden = false;
};
document.getElementById('use-provider').onclick = () => {
  if (state.current) state.current.providerEnabled = true;
  document.getElementById('use-provider').textContent = 'Enabled for this project';
};

document.getElementById('start').onclick = () => {
  const text = document.getElementById('task').value.trim();
  const errBox = document.getElementById('start-error');
  errBox.innerHTML = '';
  if (!text) { document.getElementById('run-status').textContent = 'Write a task first.'; return; }

  // Provider setup lives in Settings, so that is where the person is sent.
  if (!state.current.providerEnabled) { show('settings'); return; }

  // The backend rejects the first run in a folder nested inside another
  // project with code working_copy_overlaps; the UI has no message for it.
  if (state.current.overlapsParent && !state.firstStartDone) {
    state.firstStartDone = true;
    showError({ code: 'working_copy_overlaps' });
    return;
  }

  const session = { attemptId: 'att_7731', runtimeId: 'rt_02', generationId: 'gen_0042' };
  state.tasks.push({ id: 'task_0002', title: text });
  document.getElementById('run-status').textContent =
    'Running ' + session.attemptId + ' / ' + session.runtimeId + ' / ' + session.generationId;
};

function showError(err) {
  const messages = {};
  const box = document.createElement('div');
  box.className = 'error';
  box.textContent = messages[err.code] || 'Something went wrong. Please try again.';
  document.getElementById('start-error').appendChild(box);
}

renderProjects();
</script>
</body>
</html>
