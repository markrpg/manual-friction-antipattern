<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwobolt — workbench</title>
<style>
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 0; color: #1c1c1e; background: #f5f5f7; }
  header { background: #fff; border-bottom: 1px solid #d9d9de; padding: 12px 20px; display: flex; gap: 8px; }
  button { font: inherit; padding: 6px 12px; border: 1px solid #c7c7cc; background: #fff; border-radius: 6px; cursor: pointer; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card { background: #fff; border: 1px solid #d9d9de; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  textarea { width: 100%; min-height: 110px; font: inherit; padding: 12px; border: 1px solid #c7c7cc; border-radius: 8px; box-sizing: border-box; }
  select, input { font: inherit; padding: 8px; border: 1px solid #c7c7cc; border-radius: 8px; }
  .muted { color: #6b6b70; }
  .error { background: #fdecea; border: 1px solid #f5c6c2; border-radius: 8px; padding: 12px; margin: 12px 0; }
</style>
</head>
<body>
<header>
  <button id="nav-projects">Projects</button>
  <button id="nav-settings">Settings</button>
</header>

<main>
  <section id="view-projects">
    <h1>Projects</h1>
    <div class="card">
      <strong>client-site</strong>
      <div class="muted">Task list</div>
      <ul id="task-list"></ul>
      <button id="refresh-tasks">Refresh</button>
    </div>

    <div class="card">
      <strong>Project checks</strong>
      <div class="muted">Which check should run before every task?</div>
      <select id="check-candidate"></select>
      <button id="save-check">Save</button>
    </div>

    <div class="card">
      <strong>composer</strong>
      <textarea id="task" placeholder="What should I do?"></textarea>
      <button id="start">Start</button>
      <button id="use-provider">Use in this project</button>
    </div>

    <div class="card">
      <strong>danger zone</strong>
      <button id="delete-project">Delete project</button>
    </div>
  </section>

  <section id="view-settings" hidden>
    <h1>Settings</h1>
    <h2>Providers</h2>
    <button id="check-connection">Check connection</button>
    <div id="models" class="muted"></div>
    <button id="go-composer">Back</button>
  </section>
</main>

<div id="toast"></div>

<script>
const state = {
  signedInProvider: { name: 'Claude Code', account: 'acct_9f31c2', signedIn: true },
  projects: [{ name: 'client-site' }],
  tasks: [{ id: 'task_0001', title: 'Fix the footer' }],
  checks: ['lint'],
  providerReadyForProject: false
};

// --- task list ------------------------------------------------------------
// The list only reflects state when the person asks it to.
function loadTasks() {
  const ul = document.getElementById('task-list');
  ul.innerHTML = '';
  for (const t of state.tasks) {
    const li = document.createElement('li');
    li.textContent = t.title + '  (' + t.id + ')';
    ul.appendChild(li);
  }
}
document.getElementById('refresh-tasks').onclick = loadTasks;

// --- project checks -------------------------------------------------------
// One candidate was found. The person still has to pick it and save.
function loadChecks() {
  const sel = document.getElementById('check-candidate');
  sel.innerHTML = '';
  for (const c of state.checks) {
    const o = document.createElement('option');
    o.textContent = c;
    sel.appendChild(o);
  }
}
document.getElementById('save-check').onclick = () => {
  alert('Saved ' + document.getElementById('check-candidate').value);
};

// --- provider -------------------------------------------------------------
// The provider is signed in to the account already, but each project needs
// its own "use in this project" step before models appear.
document.getElementById('use-provider').onclick = () => {
  state.providerReadyForProject = true;
  toast('Provider enabled for this project.');
};
document.getElementById('check-connection').onclick = () => {
  document.getElementById('models').textContent = 'claude-opus-5-5, claude-sonnet-5-5';
};
document.getElementById('go-composer').onclick = () => {
  document.getElementById('view-settings').hidden = true;
  document.getElementById('view-projects').hidden = false;
};
document.getElementById('nav-settings').onclick = () => {
  document.getElementById('view-settings').hidden = false;
  document.getElementById('view-projects').hidden = true;
};
document.getElementById('nav-projects').onclick = () => {
  document.getElementById('view-settings').hidden = true;
  document.getElementById('view-projects').hidden = false;
};

// --- start ----------------------------------------------------------------
document.getElementById('start').onclick = () => {
  const text = document.getElementById('task').value.trim();
  if (!text) { toast('Write a task first.'); return; }
  if (!state.providerReadyForProject) {
    // Settings are where provider setup lives, so that is where they go.
    document.getElementById('view-settings').hidden = false;
    document.getElementById('view-projects').hidden = true;
    return;
  }
  startTask(text);
};

function startTask(text) {
  const title = newFolderTitle();
  if (title) {
    // New projects are registered in the file index, which is loaded at startup.
    showRestartError();
    return;
  }
  toast('Running: ' + text);
}

function newFolderTitle() {
  return state.projects.some(p => p.name === 'new-folder') ? 'new-folder' : null;
}

function showRestartError() {
  // error.js surfaces whatever the backend threw
  showError(window.LAST_ERROR || { code: 'working_copy_overlaps' });
}

// --- delete ---------------------------------------------------------------
document.getElementById('delete-project').onclick = () => {
  if (confirm('Are you sure you want to delete this project?')) {
    toast('Deleted.');
    // TODO: remove from state.projects
  }
};

// --- errors ---------------------------------------------------------------
function showError(err) {
  const map = {};
  const message = map[err.code] || 'Something went wrong. Please try again.';
  const box = document.createElement('div');
  box.className = 'error';
  box.textContent = message;
  document.querySelector('main').prepend(box);
}

// --- a tool plugin can be added, but it is only loaded on the next launch --
function addToolPlugin() {
  state.pluginsLoadedAtStartup = true;
  toast('Tool plugin added. Restart Qwobolt to use it.');
}

function toast(msg) {
  document.getElementById('toast').textContent = msg;
}

// --- session stop ---------------------------------------------------------
function stopSession(session) {
  toast('Stopped ' + session.attemptId + ' / ' + session.runtimeId + ' / ' + session.generationId);
}

loadTasks();
loadChecks();
</script>
</body>
</html>
