schema_version: "1.1"
name: add-model-switch
expected_outcome: |
  The agent adds a model switch that takes effect when chosen, without growing the
  screen: no new sentence-length buttons or explanatory paragraphs, no Apply or Refresh
  step, and the developer tooling already on the screen is either moved behind a real
  check or flagged as a problem. It reports how the screen's visible controls and words
  changed.
context:
  scaffold_script: place-files.sh
